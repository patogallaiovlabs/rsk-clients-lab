# RSKj simulation config (mounted at /var/lib/rsk/rsk.conf)
# Edit this file; docker-compose only needs -Drsk.conf.file pointing here.

peer {
    discovery {
        enabled = true
    }
    active = [{
        url = "enode://aaef01ee73aeff8b6a406db652c8b5a4dd805bf0ae957af09d6e49acb503af64240081cdae913cff718f0495640ed6eb5a5d6111c0c0b8e00dc005a1c3f41241@rskj-miner1:50501"
    },{
        url = "enode://648710d9e2b64524929efb666ae43d2a1c8b001ada6d7c26cd3f6f1419696d850630c901a6859fb438200c06dd34cf956844f48816ce087053bd3fa67d642a1d@rskj-miner2:50502"
    }]
    messageQueue {
        thresholdPerMinutePerPeer = 100000
    }
}


miner {
    server{
        enabled = true
        updateWorkOnNewTransaction = true
    }
    client {
        enabled = true
        
        # Enable timed mining (overrides autoMine and delayBetweenBlocks)
        timedMine = true
        
        # Configure the median time between blocks
        # This follows an exponential distribution
        medianBlockTime = 5 seconds
        
        # These settings are ignored when timedMine is true
        autoMine = false
        delayBetweenBlocks = 0 seconds
        delayBetweenRefreshes = 1 second
    }
}

database {
    dir = "./test/local-regtest/database"

    rocksdb {
        maxOpenFiles = 100
        sharedBlockCacheSize = 256M
    }
}

# In-heap caches (DataSourceWithCache / trie); counted against JVM -Xmx, not NMT "non_jvm".
cache {
    states {
        # Trie node cache during block processing (see reference.conf for sizing notes).
        max-elements = 10000000
        persist-snapshot = true
    }
    stateRoots {
        # Pre-Wasabi state root mappings; small for regtest.
        max-elements = 400000
    }
    receipts {
        # Java heap cache in front of receipts RocksDB.
        max-elements = 20000    
    }
    blooms {
        max-elements = 10000
        persist-snapshot = false
    }
    btcBlockStore {
        depth = 5000
        size = 1000
    }

    blockStore {
        size = 500 # see ForkDetectionDataRule in RSKJ, it is also used for syncing blocks.
    }

    remascCache {
        size = 500 
    }
}

sync {
    peer.count = 20
    netBlockStore.maxHeaders = 100
    netBlockStore.maxBlocks = 100
    netBlockStore {
        # How often (in processed blocks) cleanup checks run, default is 200
        processedBlocksToCheckStore = 50
        # Range of old block heights to release from memory when cleanup triggers, default is 1000
        releasedRange = 100
    }
}

transaction {
    accountSlots = 500
    accountTxRateLimit {
        enabled = false
    }
}

rpc {
    gasEstimationCap = 17000000
    # Enable the debug module so debug_wireProtocolQueueSize is exposed
    # (used by rsk-rpc-exporter -> rsk_wire_protocol_queue_size).
    modules = {
        debug {
            version: "1.0",
            enabled: "true"
        }
    }
    providers {
        web {
            cors = "*"
            http {
                enabled = true
                bind_address = "0.0.0.0"
                port = 4444
                hosts = ["localhost", "127.0.0.1", "::1", "rskj-miner1", "rskj-miner2", "rskj-miner3", "rskj-miner4", "rskj-node1", "rskj-node2", "host.docker.internal"]
            }
            ws {
                enabled = true
                port = 4445
            }
        }
    }
}

targetgaslimit = 17000000
forcegaslimit = true

# Disable RSKIP144 (parallel transaction execution / PTE). With PTE active the
# per-transaction gas limit is the *sublist* gas limit (the block gas limit split
# across parallel execution sublists, e.g. 25M -> ~8.33M). 
# Setting the activation height negative disables the rule
# (ActivationConfig.isActive requires 0 <= height), so validation uses the full
# block gas limit. This is a consensus rule: it must match on ALL nodes.
blockchain {
    config {
        consensusRules {
            rskip144 = -1
            # Activate RSKIP97 at genesis so block 1's difficulty is computed from
            # the parent instead of being reset to regtest's minimumDifficulty (0).
            # With genesis timestamp = 0, the legacy difficulty-drop path (active
            # when rskip97 is disabled) would reset block 1 to difficulty 0, whose
            # total difficulty ties genesis and can never become the best block, so
            # the chain gets stuck at block 0. Must match on ALL nodes.
            rskip97 = 0
        }
    }
}

crypto {
#    library = "bc"
}
